<article class="speaker-card [@container_speakers-list_(min-width:_44rem)]:flex-[0_1_calc((100%-1.25rem)/2)] [@container_speakers-list_(min-width:_68rem)]:flex-[0_1_calc((100%-3rem)/3)]">
  <img class="speaker-card-image" src="{{ image }}" alt="{{ alt }}" loading="lazy" />
  <div class="p-6">
    <h2 class="speaker-card-title">{{ name }}</h2>
    <p class="speaker-card-role">{{ role }}</p>
    <p class="mb-0 text-base leading-6">
      {{ text }}
    </p>
  </div>
</article>
