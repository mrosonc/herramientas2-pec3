<article class="ia-recipe-card">
  <h3 class="font-bold text-sm mb-4">{{ title }}</h3>
  <div class="flex items-start gap-3">
    <img
      src="{{ avatar }}"
      alt="{{ author }}"
      width="40"
      height="40"
      class="rounded-full object-cover shrink-0"
    />
    <div>
      <p class="font-bold text-sm mb-1">{{ author }}</p>
      <p class="text-gray-500 text-sm mb-0">{{ desc }}</p>
    </div>
  </div>
</article>
